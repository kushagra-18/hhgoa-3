services:
  # PostgreSQL 16 with pgvector extension for 512-dim face embeddings
  db:
    image: pgvector/pgvector:pg16
    container_name: hhgoa_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: face_verification_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d face_verification_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Main Face-to-Blockchain Pipeline & Web UI
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hhgoa_pipeline_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/face_verification_db
      - INSIGHTFACE_MODEL_NAME=buffalo_l
      - INSIGHTFACE_DET_SIZE=640
      - APP_ENV=development
      - HOST=0.0.0.0
      - PORT=8000
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-07baa74b32000d48a53f77fde2089f03cb56eee85688355b971b20b92a8bb2ba}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.70}
    env_file:
      - .env
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./contracts:/app/contracts
      - ./data:/app/data
      - ./models:/app/models
      - ./models:/root/.insightface/models

volumes:
  pgdata:
    driver: local
